[package]
name = "ac2-network-bridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
default-run = "ac2-network-bridge"

[[bin]]
name = "ac2-capture-decode"
path = "src/capture_decode.rs"

[dependencies]
ac2-gun-friends = { path = "../GunFriends" }
ac2-net = { path = "../../References/AC2_Rusted/crates/ac2-net" }
ac2-dat = { path = "../../References/AC2_Rusted/crates/ac2-dat" }
ac2-core = { path = "../../References/AC2_Rusted/crates/ac2-core" }
ac2-db = { path = "../../References/AC2_Rusted/crates/ac2-db" }
ac2-script = { path = "../../References/AC2_Rusted/crates/ac2-script" }
serde_json = "1"
flate2 = "1"

[dev-dependencies]
legions-server-double = { path = "../../References/AC2_Rusted/tools/legions-server-double" }

[profile.release]
overflow-checks = true

